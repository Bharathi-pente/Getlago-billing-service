version: '3.8'

services:
  billing-service:
    image: node:20-alpine
    container_name: billing-service
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - LAGO_API_KEY=${LAGO_API_KEY}
      - LAGO_URL=${LAGO_URL}
      - LAGO_WEBHOOK_SECRET=${LAGO_WEBHOOK_SECRET}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    command: sh -c "npm install && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - billing-network

  postgres:
    image: postgres:15-alpine
    container_name: billing-postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billing-network

volumes:
  postgres-data:

networks:
  billing-network:
    driver: bridge
